# Railway uses nixpacks to build the deployment image. By default it
# picks up Node + npm from package.json and produces a runnable image.
# We need one extra piece for the Instagram-reel renderer:
#
#   ffmpeg from Debian's repo, which has libavfilter's `drawtext`
#   filter compiled in. The npm `ffmpeg-static` binary we install via
#   package.json works locally on macOS, but its Linux build (John
#   Van Sickle's static binary) silently omits `drawtext` despite
#   advertising `--enable-libfreetype` in its configure line. Our
#   reel composer relies on drawtext for the track / artist / album
#   text overlays; without it the route returns ffmpeg exit code 8
#   with "No such filter: 'drawtext'".
#
# `aptPkgs` installs Debian packages during the setup phase of the
# build. The system ffmpeg ends up at /usr/bin/ffmpeg, where the
# composer's auto-resolver picks it up ahead of ffmpeg-static.
# (ffmpeg-static stays installed via npm because we still want a
# working fallback for environments without a system ffmpeg — local
# dev on machines without brew, CI, etc.)

[phases.setup]
aptPkgs = ["ffmpeg"]
