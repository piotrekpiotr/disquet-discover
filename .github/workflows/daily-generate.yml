# Generate the next batch of pending recommendations every day.
#
# Schedule: twice daily at 04:00 and 11:00 UTC.
#
#   04:00 UTC = 06:00 Warsaw CEST (summer) / 05:00 CET (winter) — the
#   curator's target morning slot. This is the "real" run: scan every
#   artist + every label + every press feed, commit, deploy.
#
#   11:00 UTC = 13:00 Warsaw CEST / 12:00 CET — insurance. Every sync
#   script is idempotent (deduped by id + artist|title), so running a
#   second pass a few hours later costs nothing if the morning run was
#   clean, but recovers what was lost on days when Apple / Deezer /
#   GitHub's runner IP range hit a throttle. Different runner, different
#   IP — often unblocks what failed six hours earlier.
#
# Any failed day still leaves the site running the previous day's pool,
# because only the commit step modifies the repo and every script exits 0
# even on a catastrophic crash. The only way for this workflow to fail
# the whole run is the final health summary, and that only fires when
# EVERY release source returned zero (i.e. genuinely nothing shipped).
#
# Manual runs: use the "Run workflow" button on the Actions tab. Useful
# for backfilling or testing without waiting for the schedule.

name: Generate daily recommendation pool

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    # One run at a time per branch: the second cron must wait for the first
    # (or a manual run) to finish. Prevents two commits racing each other.
    concurrency:
      group: daily-generate-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      # Last.fm similarity key. Optional — if unset, sync-media still
      # runs but auto-promotion is disabled (candidates all need manual
      # review). See scripts/sources/lastfm.mjs for the API shape.
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      # No Spotify auth needed any more — backfill-spotify resolves
      # album URLs via the public Songlink/Odesli API, which takes an
      # Apple/Deezer URL and returns the Spotify equivalent. The old
      # Client-Credentials flow now requires a paid Spotify Premium
      # account so we dropped it; Songlink covers the same ground.
      # Override model for description writing if the default in
      # write-descriptions.mjs ever goes stale.
      DISQUET_MODEL: ${{ secrets.DISQUET_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          # Full history so the commit we push has a valid parent even on
          # first-time runs, and so `git status` shows nothing spurious
          # on the commit step.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Per-artist release sync (iTunes primary, Deezer fallback)
        # Scans EVERY artist in the pool (hardcoded ARTISTS + curator's
        # monitoring-extras + any auto-promoted artists from previous runs)
        # against iTunes first, Deezer on miss. No caps. Exits 0 even on
        # crash — the health summary at the end catches genuine zero days.
        id: sync_artists
        continue-on-error: true
        run: node scripts/sync-artists.mjs

      - name: Per-label release sync (Discogs)
        # Scans every label in the pool; no global cap. Discogs is the
        # source of truth for catalogue lag (a record that came out last
        # week but only got scanned into the Discogs DB this morning).
        id: sync_labels
        continue-on-error: true
        run: node scripts/sync-labels.mjs

      - name: Media & press scan (Pitchfork / Quietus / RA / Fact)
        # Two jobs: bump pressMentions on existing records, and accumulate
        # candidates (artists we don't track that the critics are writing
        # about). When the LASTFM_API_KEY is set AND a candidate has ≥2
        # independent outlets AND scores above the similarity threshold
        # against the current pool, the candidate is auto-promoted into
        # monitoring-extras (picked up by tomorrow's sync-artists).
        id: sync_media
        continue-on-error: true
        run: node scripts/sync-media.mjs

      - name: Backfill embedded players for new records
        # Tries Apple Music / Deezer first, then Bandcamp. Each script
        # skips records that already have an embed, so they're idempotent.
        # Rate-limit / network failures here just leave the record without
        # an embed — the public site falls back to a search-links card.
        #
        # backfill-bandcamp also upgrades links.bandcamp from the seed
        # search URL to the real album URL even when a higher-priority
        # embed was already set — so the "Bandcamp" row on a record
        # ultimately deep-links to the right page regardless of which
        # service gave us the player.
        continue-on-error: true
        run: |
          node scripts/enrich-labels-and-embeds.mjs || true
          node scripts/backfill-embeds.mjs || true
          node scripts/backfill-bandcamp.mjs || true

      - name: Upgrade Deezer embeds to Apple Music when iTunes can match
        # backfill-embeds.mjs picks Apple first, falls back to Deezer when
        # iTunes throttles. Records that landed on Deezer because of a
        # throttle (not a genuine miss) get revisited here on a fresh
        # runner IP and promoted to Apple when iTunes finally answers.
        # Idempotent: only touches deezer-provider embeds. Self-skips
        # everything else.
        continue-on-error: true
        run: node scripts/upgrade-deezer-to-apple.mjs || true

      - name: Resolve Spotify album URLs (search → real album link)
        # Songlink/Odesli public API — no auth required. Feeds each
        # record's existing Apple or Deezer URL to Songlink and gets
        # back the matching Spotify album URL, so the "Spotify" row on
        # a record card deep-links into the native app instead of
        # opening a search page. Records without an Apple/Deezer seed
        # (the rare ones where every release-discovery source missed)
        # stay on the search URL.
        continue-on-error: true
        run: node scripts/backfill-spotify.mjs || true

      - name: Write descriptions for the new pending batch
        # Missing ANTHROPIC_API_KEY, bad model name, quota hit, or API
        # outage just ships records without descriptions. The curator can
        # retry manually from /admin.
        continue-on-error: true
        run: node scripts/write-descriptions.mjs --only-pending --limit 15

      - name: Commit the generated batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Drop the sidecar stats file before diffing — it's gitignored
          # but belt-and-suspenders in case .gitignore changes.
          rm -f data/.sync-artists-stats.json
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "disquet-bot"
            git config user.email "disquet-bot@users.noreply.github.com"
            git add data/
            git commit -m "daily pool: new pending batch ($(date -u +%Y-%m-%d\ %H:%MZ))"
            git push
          else
            echo "No new records this run - nothing to commit."
          fi

      # Run-health summary. Only fails the workflow when EVERY source
      # returned nothing AND nothing was committed — i.e. a genuine zero
      # day, which is the only case worth emailing the curator about. A
      # partial day (iTunes down, Deezer ok, Discogs ok) is still useful
      # and shouldn't alert.
      - name: Run-health summary
        if: always()
        run: |
          {
            echo "## Daily pool run summary"
            echo ""
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| sync-artists | ${{ steps.sync_artists.outcome }} |"
            echo "| sync-labels | ${{ steps.sync_labels.outcome }} |"
            echo "| sync-media | ${{ steps.sync_media.outcome }} |"
            echo ""
            if [ -f data/.sync-artists-stats.json ]; then
              echo "### Per-source stats"
              echo ""
              echo '```json'
              cat data/.sync-artists-stats.json
              echo '```'
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Alert only if ALL THREE release/press sources failed. The 11:00
          # UTC second cron is the main recovery mechanism; this failure is
          # for the rare case where it too came back empty-handed.
          if [ "${{ steps.sync_artists.outcome }}" = "failure" ] && \
             [ "${{ steps.sync_labels.outcome }}" = "failure" ] && \
             [ "${{ steps.sync_media.outcome }}" = "failure" ]; then
            {
              echo "⚠️  All three sources failed this run. Check the step"
              echo "logs and consider a manual \"Run workflow\" on Actions;"
              echo "a different runner often clears transient IP throttles."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
